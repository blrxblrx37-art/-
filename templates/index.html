<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ＢＬ＿Ｘ２ | FreeFire Level Up Bot — ULTRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #02030a;
            --accent-cyan: #00ffe0;
            --accent-blue: #00b3ff;
            --accent-purple: #b537f2;
            --accent-pink: #ff2fb5;
            --accent-green: #00ff88;
            --accent-red: #ff2d55;
            --accent-amber: #ffb800;
            --gold: #ffd700;
            --text-main: #f0f9ff;
            --text-muted: #7a8ba3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Outfit', sans-serif;
        }

        html, body { overflow-x: hidden; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            position: relative;
        }

        /* ═══ Animated Background ═══ */
        .bg-anim {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background:
                radial-gradient(circle at 15% 15%, rgba(181, 55, 242, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(0, 255, 224, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 90%, rgba(255, 47, 181, 0.18) 0%, transparent 45%),
                linear-gradient(180deg, #02030a 0%, #05081a 50%, #02030a 100%);
            background-size: 200% 200%;
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { background-position: 0% 0%, 100% 0%, 50% 100%, 0% 0%; }
            50% { background-position: 100% 100%, 50% 100%, 100% 0%, 0% 0%; }
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image:
                linear-gradient(rgba(0, 255, 224, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 224, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            animation: gridMove 30s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ═══ Header ═══ */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 30px;
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.85), rgba(20, 15, 40, 0.85));
            border: 1px solid rgba(0, 255, 224, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 0 0 40px rgba(0, 255, 224, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), var(--accent-pink), transparent);
            background-size: 200% 100%;
            animation: lineSlide 3s linear infinite;
        }

        @keyframes lineSlide {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-box {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #00ffe0, #b537f2, #ff2fb5);
            background-size: 200% 200%;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 255, 224, 0.5);
            animation: gradientShift 3s ease infinite, pulseGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, #00ffe0, #b537f2, #00ffe0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 224, 0.1));
            border: 1px solid rgba(0, 255, 136, 0.4);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulseDot 1.2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.7); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ═══ Buttons ═══ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffe0, #00b3ff, #b537f2);
            background-size: 200% 200%;
            color: #02030a;
            box-shadow: 0 4px 20px rgba(0, 255, 224, 0.4);
            animation: gradientShift 3s ease infinite;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 255, 224, 0.6);
        }

        .btn-secondary {
            background: rgba(0, 255, 224, 0.05);
            border: 1px solid rgba(0, 255, 224, 0.25);
            color: var(--accent-cyan);
        }

        .btn-secondary:hover {
            background: rgba(0, 255, 224, 0.12);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 224, 0.3);
            transform: translateY(-2px);
        }

        /* ═══ Stats Grid ═══ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.7), rgba(20, 15, 40, 0.5));
            border: 1px solid rgba(0, 255, 224, 0.15);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(20px) saturate(180%);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 224, 0.05), transparent);
            transition: left 0.6s;
        }

        .stat-card:hover::before { left: 100%; }

        .stat-card:hover {
            border-color: rgba(0, 255, 224, 0.55);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 40px rgba(0, 255, 224, 0.15);
        }

        .stat-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s;
        }

        .stat-card:hover .stat-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        .stat-icon.cyan { background: linear-gradient(135deg, rgba(0, 255, 224, 0.2), rgba(0, 179, 255, 0.1)); color: var(--accent-cyan); box-shadow: 0 0 25px rgba(0, 255, 224, 0.4); }
        .stat-icon.green { background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 224, 0.1)); color: var(--accent-green); box-shadow: 0 0 25px rgba(0, 255, 136, 0.4); }
        .stat-icon.purple { background: linear-gradient(135deg, rgba(181, 55, 242, 0.2), rgba(255, 47, 181, 0.1)); color: #d4a5ff; box-shadow: 0 0 25px rgba(181, 55, 242, 0.4); }
        .stat-icon.amber { background: linear-gradient(135deg, rgba(255, 184, 0, 0.2), rgba(255, 47, 181, 0.1)); color: var(--accent-amber); box-shadow: 0 0 25px rgba(255, 184, 0, 0.4); }

        .stat-content h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 255, 224, 0.5);
        }

        .stat-content p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ═══ Dashboard Layout ═══ */
        .dashboard-main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 26px;
        }

        .card-box {
            background: linear-gradient(135deg, rgba(10, 15, 30, 0.75), rgba(20, 15, 40, 0.55));
            border: 1px solid rgba(0, 255, 224, 0.15);
            border-radius: 22px;
            padding: 26px;
            backdrop-filter: blur(24px) saturate(180%);
            position: relative;
            overflow: hidden;
        }

        .card-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
            background-size: 200% 100%;
            animation: lineSlide 3s linear infinite;
        }

        .box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .box-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .box-title i {
            filter: drop-shadow(0 0 8px currentColor);
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ═══ Account Card with Terminal ═══ */
        .account-card {
            background: linear-gradient(135deg, rgba(8, 13, 26, 0.85), rgba(20, 15, 40, 0.7));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 22px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .account-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            background-size: 100% 200%;
            animation: lineSlideV 2s linear infinite;
        }

        @keyframes lineSlideV {
            0% { background-position: 0 200%; }
            100% { background-position: 0 -200%; }
        }

        .account-card:hover {
            background: linear-gradient(135deg, rgba(15, 22, 45, 0.9), rgba(30, 20, 55, 0.75));
            border-color: rgba(0, 255, 224, 0.55);
            box-shadow: 0 10px 40px rgba(0, 255, 224, 0.15);
        }

        .acc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .acc-profile {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .acc-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 224, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 224, 0.2);
            transition: all 0.3s;
        }

        .account-card:hover .acc-avatar {
            box-shadow: 0 0 30px rgba(0, 255, 224, 0.5);
            transform: rotate(-5deg) scale(1.05);
        }

        .acc-info h4 {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 224, 0.3);
        }

        .region-badge {
            background: linear-gradient(135deg, rgba(181, 55, 242, 0.2), rgba(255, 47, 181, 0.15));
            color: #e0b0ff;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            border: 1px solid rgba(181, 55, 242, 0.4);
            box-shadow: 0 0 12px rgba(181, 55, 242, 0.3);
        }

        .acc-info span {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .acc-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-online {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 255, 224, 0.1));
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
        }

        .status-match {
            background: linear-gradient(135deg, rgba(0, 255, 224, 0.15), rgba(0, 179, 255, 0.15));
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 224, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 224, 0.4);
            animation: matchPulse 1.5s infinite alternate;
        }

        @keyframes matchPulse {
            0% { box-shadow: 0 0 15px rgba(0, 255, 224, 0.3); }
            100% { box-shadow: 0 0 35px rgba(0, 255, 224, 0.7); }
        }

        /* ═══ EXP Box ═══ */
        .exp-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4), rgba(20, 15, 40, 0.3));
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .exp-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .exp-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .exp-val {
            font-size: 16px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
        }

        .exp-gained { color: var(--accent-green) !important; }

        .gained-badge {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 224, 0.1));
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }

        /* ═══ Level Progress ═══ */
        .level-progress {
            margin-bottom: 16px;
        }

        .level-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .progress-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green), var(--accent-purple));
            background-size: 200% 100%;
            border-radius: 10px;
            transition: width 0.6s ease;
            box-shadow: 0 0 15px rgba(0, 255, 224, 0.6);
            animation: progressShine 2s linear infinite;
        }

        @keyframes progressShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ═══ PER-ACCOUNT TERMINAL ═══ */
        .acc-terminal {
            background: linear-gradient(180deg, #01020a, #05040f);
            border: 1px solid rgba(0, 255, 224, 0.2);
            border-radius: 12px;
            margin-top: 14px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 255, 224, 0.05);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: linear-gradient(90deg, rgba(0, 255, 224, 0.08), rgba(181, 55, 242, 0.05));
            border-bottom: 1px solid rgba(0, 255, 224, 0.15);
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .terminal-dots {
            display: flex;
            gap: 5px;
        }

        .terminal-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .terminal-dot.red { background: #ff5f56; box-shadow: 0 0 8px #ff5f56; }
        .terminal-dot.yellow { background: #ffbd2e; box-shadow: 0 0 8px #ffbd2e; }
        .terminal-dot.green { background: #27c93f; box-shadow: 0 0 8px #27c93f; }

        .terminal-body {
            padding: 12px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.6;
            max-height: 180px;
            min-height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .terminal-body::-webkit-scrollbar {
            width: 4px;
        }

        .terminal-body::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 2px;
        }

        .terminal-line {
            display: flex;
            gap: 8px;
            animation: logAppear 0.3s ease;
            word-break: break-all;
        }

        @keyframes logAppear {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .terminal-time {
            color: #4a5568;
            font-weight: 600;
            flex-shrink: 0;
        }

        .terminal-msg {
            flex: 1;
        }

        .terminal-msg.info { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
        .terminal-msg.success { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.4); }
        .terminal-msg.warning { color: #ffb800; text-shadow: 0 0 8px rgba(255, 184, 0, 0.4); }
        .terminal-msg.error { color: #ff2d55; text-shadow: 0 0 8px rgba(255, 45, 85, 0.4); }

        .terminal-empty {
            text-align: center;
            color: rgba(122, 139, 163, 0.5);
            font-style: italic;
            padding: 20px 0;
        }

        /* ═══ Account Actions ═══ */
        .acc-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: var(--text-muted);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 224, 0.2);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .icon-btn:hover {
            background: rgba(0, 255, 224, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 224, 0.4);
            transform: translateY(-2px);
        }

        .icon-btn.danger:hover {
            background: rgba(255, 45, 85, 0.15);
            color: var(--accent-red);
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(255, 45, 85, 0.4);
        }

        .icon-btn.active {
            background: rgba(0, 255, 224, 0.2);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 224, 0.4);
        }

        /* ═══ Modal ═══ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 3, 10, 0.9);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: linear-gradient(135deg, #050813, #0a0515);
            border: 1.5px solid rgba(0, 255, 224, 0.4);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 80px rgba(0, 255, 224, 0.15);
            position: relative;
            animation: modalSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-cyan));
            background-size: 200% 100%;
            animation: lineSlide 3s linear infinite;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(90deg, #00ffe0, #b537f2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 224, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(0, 255, 224, 0.15), 0 0 20px rgba(0, 255, 224, 0.3);
        }

        .form-input option {
            background: #0a0515;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 52px;
            margin-bottom: 16px;
            color: rgba(0, 255, 224, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* ═══ Scrollbar ═══ */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 10px;
        }

        @media (max-width: 640px) {
            body { padding: 14px; }
            header { padding: 16px 18px; flex-wrap: wrap; gap: 14px; }
            .brand-text h1 { font-size: 18px; }
            .exp-box { grid-template-columns: 1fr 1fr; }
            .exp-item:last-child { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-anim"></div>
    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="logo-box">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="brand-text">
                    <h1>ＢＬ＿Ｘ２ <span style="font-weight:400; color:var(--text-muted); font-size:14px;">| LEVEL UP BOT</span></h1>
                    <p>
                        <span class="live-tag"><span class="pulse-dot"></span> النظام يعمل</span>
                        <span>• ＢＬ＿Ｘ２ Engine v3.0 ULTRA</span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="fetchStats()"><i class="fa-solid fa-rotate"></i> تحديث</button>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> إضافة حساب</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon cyan"><i class="fa-solid fa-users"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-accounts">0</h3>
                    <p>حسابات نشطة</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-angles-up"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-exp" style="color:var(--accent-green)">+0 EXP</h3>
                    <p>إجمالي EXP</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fa-solid fa-trophy"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-matches">0</h3>
                    <p>الماتشات</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon amber"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-content">
                    <h3 id="stat-uptime">00:00:00</h3>
                    <p>مدة التشغيل</p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-main">
            <div class="card-box">
                <div class="box-header">
                    <div class="box-title">
                        <i class="fa-solid fa-user-astronaut" style="color:var(--accent-cyan)"></i>
                        <span>الحسابات النشطة — كل حساب له Terminal خاص</span>
                    </div>
                </div>
                <div class="accounts-list" id="accounts-container">
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>جاري تحميل الحسابات...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-plus" style="margin-left:8px;"></i> إضافة حساب جديد</h3>
                <button class="icon-btn" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-acc-form" onsubmit="submitAddAccount(event)">
                <div class="form-group">
                    <label>نوع الحساب</label>
                    <select class="form-input" id="acc-type" onchange="toggleFormType()">
                        <option value="guest">🎮 حساب ضيف (UID + Password)</option>
                        <option value="token">🔑 Access Token</option>
                    </select>
                </div>
                <div id="guest-fields">
                    <div class="form-group">
                        <label>UID</label>
                        <input type="text" class="form-input" id="acc-uid" placeholder="مثال: 7644913583">
                    </div>
                    <div class="form-group">
                        <label>كلمة السر</label>
                        <input type="text" class="form-input" id="acc-password" placeholder="مثال: BLX2_SECRET_4NM38">
                    </div>
                </div>
                <div id="token-fields" style="display:none;">
                    <div class="form-group">
                        <label>Access Token</label>
                        <textarea class="form-input" id="acc-token" rows="4" placeholder="الصق التوكن هنا..."></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:24px;">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-rocket"></i> إضافة وتشغيل</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let startTime = Date.now();
        let allLogs = [];  // بنخزن كل اللوجات

        /* ═══ Particles ═══ */
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#00ffe0', '#b537f2', '#ff2fb5', '#00b3ff', '#00ff88'];
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.background = color;
                p.style.boxShadow = `0 0 15px ${color}`;
                p.style.animationDuration = (Math.random() * 15 + 10) + 's';
                p.style.animationDelay = (Math.random() * 15 + 5) + 's';
                p.style.width = p.style.height = (Math.random() * 3 + 2) + 'px';
                container.appendChild(p);
            }
        }
        createParticles();

        /* ═══ Modal ═══ */
        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        function toggleFormType() {
            const type = document.getElementById('acc-type').value;
            document.getElementById('guest-fields').style.display = type === 'guest' ? 'block' : 'none';
            document.getElementById('token-fields').style.display = type === 'token' ? 'block' : 'none';
        }

        /* ═══ Add Account ═══ */
        async function submitAddAccount(e) {
            e.preventDefault();
            const type = document.getElementById('acc-type').value;
            let payload = {};
            if (type === 'guest') {
                const uid = document.getElementById('acc-uid').value.trim();
                const password = document.getElementById('acc-password').value.trim();
                if (!uid || !password) return alert('الرجاء إدخال UID وكلمة السر');
                payload = { uid, password };
            } else {
                const token = document.getElementById('acc-token').value.trim();
                if (!token) return alert('الرجاء إدخال التوكن');
                payload = { token };
            }

            try {
                const res = await fetch('/api/account/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    closeAddModal();
                    document.getElementById('add-acc-form').reset();
                    fetchStats();
                } else {
                    alert('خطأ: ' + (data.error || 'غير معروف'));
                }
            } catch (err) {
                alert('فشل الاتصال: ' + err);
            }
        }

        async function deleteAccount(uid) {
            if (!confirm('هل أنت متأكد من حذف الحساب ' + uid + '?')) return;
            try {
                await fetch('/api/account/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) { console.error(err); }
        }

        async function refreshAccountInfo(uid) {
            try {
                await fetch('/api/account/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) { console.error(err); }
        }

        /* ═══ Filter Logs By UID ═══ */
        function getLogsForAccount(uid) {
            const uidStr = String(uid);
            return allLogs.filter(log => {
                if (log.uid) {
                    return String(log.uid) === uidStr;
                }
                // لو مفيش uid، نبحث في الرسالة
                return log.message && log.message.includes(uidStr);
            });
        }

        /* ═══ Render Per-Account Terminal ═══ */
        function renderAccountTerminal(uid) {
            const logs = getLogsForAccount(uid).slice(-30);  // آخر 30

            if (logs.length === 0) {
                return `
                    <div class="terminal-body">
                        <div class="terminal-empty">
                            <i class="fa-solid fa-hourglass-half"></i>
                            في انتظار النشاط...
                        </div>
                    </div>
                `;
            }

            return `
                <div class="terminal-body">
                    ${logs.map(log => `
                        <div class="terminal-line">
                            <span class="terminal-time">[${log.time}]</span>
                            <span class="terminal-msg ${log.level}">${escapeHtml(log.message)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        /* ═══ Fetch Stats ═══ */
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                // احفظ اللوجات
                allLogs = data.logs || [];

                document.getElementById('stat-total-accounts').innerText = data.total_accounts;
                document.getElementById('stat-total-exp').innerText = '+' + data.total_gained_exp.toLocaleString() + ' EXP';
                document.getElementById('stat-total-matches').innerText = data.total_matches;

                const container = document.getElementById('accounts-container');
                if (data.accounts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-ghost"></i>
                            <p>لا توجد حسابات نشطة. اضغط <b>"إضافة حساب"</b> للبدء!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = data.accounts.map(acc => {
                        const gainedExp = acc.gained_exp || 0;
                        const statusClass = acc.status === 'IN_MATCH' ? 'status-match' : 'status-online';
                        const statusText = acc.status === 'IN_MATCH' ? `⚔️ في ماتش (${acc.active_matches})` : '🟢 ' + acc.status;

                        return `
                            <div class="account-card">
                                <div class="acc-top">
                                    <div class="acc-profile">
                                        <div class="acc-avatar"><i class="fa-solid fa-user-ninja"></i></div>
                                        <div class="acc-info">
                                            <h4>${escapeHtml(acc.nickname)} <span class="region-badge">${acc.region || 'BD'}</span></h4>
                                            <span>UID: ${acc.uid}</span>
                                        </div>
                                    </div>
                                    <div class="acc-status ${statusClass}">${statusText}</div>
                                </div>

                                <div class="exp-box">
                                    <div class="exp-item">
                                        <span class="exp-label">أولي</span>
                                        <span class="exp-val">${acc.initial_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">حالي</span>
                                        <span class="exp-val">${acc.current_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">مكتسب</span>
                                        <span class="exp-val exp-gained"><span class="gained-badge">+${gainedExp.toLocaleString()}</span></span>
                                    </div>
                                </div>

                                <div class="level-progress">
                                    <div class="level-labels">
                                        <span style="color:var(--accent-cyan)">Level ${acc.level}</span>
                                        <span style="color:var(--text-muted)">ماتشات: ${acc.matches_played}</span>
                                    </div>
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${Math.min(100, Math.max(15, (acc.current_exp % 1000) / 10))}%"></div>
                                    </div>
                                </div>

                                <!-- ═══ PER-ACCOUNT TERMINAL ═══ -->
                                <div class="acc-terminal">
                                    <div class="terminal-header">
                                        <div class="terminal-title">
                                            <i class="fa-solid fa-terminal"></i>
                                            Terminal — ${acc.uid}
                                        </div>
                                        <div class="terminal-dots">
                                            <span class="terminal-dot red"></span>
                                            <span class="terminal-dot yellow"></span>
                                            <span class="terminal-dot green"></span>
                                        </div>
                                    </div>
                                    ${renderAccountTerminal(acc.uid)}
                                </div>

                                <div class="acc-actions" style="margin-top: 14px;">
                                    <span>آخر ماتش: ${acc.last_match_time || 'يعمل الآن...'}</span>
                                    <div class="action-btns">
                                        <button class="icon-btn" title="تحديث" onclick="refreshAccountInfo('${acc.uid}')"><i class="fa-solid fa-rotate"></i></button>
                                        <button class="icon-btn danger" title="حذف" onclick="deleteAccount('${acc.uid}')"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    // Auto-scroll لكل terminal
                    document.querySelectorAll('.terminal-body').forEach(el => {
                        el.scrollTop = el.scrollHeight;
                    });
                }

            } catch (err) {
                console.error("Failed to fetch stats:", err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        setInterval(() => {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('stat-uptime').innerText = `${h}:${m}:${s}`;
        }, 1000);

        fetchStats();
        setInterval(fetchStats, 2500);
    </script>
</body>
</html>
